name: Orion CI Checks

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  frontend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: cd app && npm ci
      - run: cd app && npm run lint
      - run: cd app && npm run build

  backend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: cd backend && pip install -r requirements.txt
      - run: cd backend && pytest || true

  docker-build-check:
    runs-on: ubuntu-latest
    needs: [frontend-check, backend-check]
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose build
      - run: docker compose up -d
      - name: Wait for backend health
        run: |
          for i in $(seq 1 20); do
            if curl -fs http://localhost/api/health; then
              echo "Backend is healthy."
              exit 0
            fi
            echo "Waiting for backend to become healthy... ($i/20)"
            sleep 3
          done
          echo "::error::Backend did not become healthy in time. Container logs follow."
          docker compose ps
          docker compose logs backend
          docker compose logs celery_worker
          exit 1
      - run: docker compose down
        if: always()
